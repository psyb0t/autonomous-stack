name: autonomous-stack
x-common: &common
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '5'}
  networks: [stack]
services:
  prepare:
    profiles: [agent, claude, mailbox, keepassbox]
    image: ${AUTONOMOUS_IMAGE:-psyb0t/autonomous-stack:latest}
    command: [prepare]
    user: ${STACK_UID:-1000}:${STACK_GID:-1000}
    env_file: .env
    environment:
      SERVICES_ENABLED: ''
      STACK_PROFILES: ${COMPOSE_PROFILES:-none}
      HARNESS_PLATFORM: ${HARNESS_PLATFORM:-claudebox}
      PIBOX_ZAI_BASE_URL: ${PIBOX_ZAI_BASE_URL:-https://api.z.ai/api/anthropic}
      PIBOX_ZAI_AUTH_TOKEN: ${PIBOX_ZAI_AUTH_TOKEN:-}
      PIBOX_ZAI_DEFAULT_MODEL: ${PIBOX_ZAI_DEFAULT_MODEL:-glm-5.3-flash}
      ENV: prod
      LOG_LEVEL: info
      # Setup reads .env but does not need the browser's solver credential.
      CAPTCHA_SOLVER_API_KEY: ''
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    network_mode: none
    volumes:
      - ./config/generated:/stack/config/generated
      - ./config/mailbox:/stack/config/mailbox
      - ./data/workspace:/stack/data/workspace
      - ./data/keepassbox:/stack/data/keepassbox
    tmpfs: ['/tmp:size=16m,noexec,nosuid']
  handoff:
    <<: *common
    profiles: [handoff]
    image: ${AUTONOMOUS_IMAGE:-psyb0t/autonomous-stack:latest}
    command: [run]
    user: ${STACK_UID:-1000}:${STACK_GID:-1000}
    environment:
      ENV: prod
      LOG_LEVEL: info
      LOG_FORMAT: json
      LOG_ADD_SOURCE: 'true'
      SERVICES_ENABLED: handoff
      AUTONOMOUS_TOKEN: ${AUTONOMOUS_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      AUTONOMOUS_VIEWER_URL: ${AUTONOMOUS_VIEWER_URL:-http://${TS_HOSTNAME:-autonomous-stack}}
      AUTONOMOUS_BROWSER_VIEWER_URL: ${AUTONOMOUS_BROWSER_VIEWER_URL:-http://browser:5900}
      AUTONOMOUS_REQUEST_TTL: ${AUTONOMOUS_REQUEST_TTL:-24h}
    cap_drop: [ALL]
    read_only: true
    mem_limit: ${HANDOFF_MEMORY:-256m}
    cpus: ${HANDOFF_CPUS:-1}
    pids_limit: 128
    tmpfs: ['/tmp:size=64m,noexec,nosuid']
    volumes: [./data/handoff:/state]
    depends_on:
      browser: {condition: service_healthy, required: false}
    healthcheck:
      test: [CMD, ./app, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
  tailscale:
    <<: *common
    profiles: [tailscale]
    image: &tailscale_image tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    user: ${STACK_UID:-1000}:${STACK_GID:-1000}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-autonomous-stack}
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: 'true'
      TS_USERSPACE: 'true'
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:---accept-dns=false}
      TS_ENABLE_HEALTH_CHECK: 'true'
      TS_SOCKET: /var/lib/tailscale/tailscaled.sock
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    cap_drop: [ALL]
    read_only: true
    mem_limit: ${TAILSCALE_MEMORY:-256m}
    cpus: ${TAILSCALE_CPUS:-1}
    pids_limit: 128
    volumes: [./data/tailscale:/var/lib/tailscale]
    tmpfs: ['/tmp:size=64m,noexec,nosuid', '/var/run:size=8m,noexec,nosuid,mode=1777']
    depends_on:
      handoff: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9002/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
  tailscale-serve:
    profiles: [tailscale]
    image: *tailscale_image
    user: ${STACK_UID:-1000}:${STACK_GID:-1000}
    entrypoint: [tailscale, --socket=/var/lib/tailscale/tailscaled.sock]
    command: [serve, --bg, --yes, --http=80, 'http://handoff:8081']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    network_mode: none
    volumes: [./data/tailscale:/var/lib/tailscale:ro]
    depends_on:
      tailscale: {condition: service_healthy}
  mailbox:
    <<: *common
    profiles: [mailbox]
    image: psyb0t/mailbox:latest
    user: ${STACK_UID:-1000}:${STACK_GID:-1000}
    environment:
      MAILBOXD_CONFIG: /etc/mailboxd/config.yaml
      MAILBOXD_STATE_PATH: /var/lib/mailboxd/state.db
      MAILBOX_TOKEN: ${MAILBOX_TOKEN:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    cap_drop: [ALL]
    read_only: true
    mem_limit: ${MAILBOX_MEMORY:-512m}
    cpus: ${MAILBOX_CPUS:-1}
    pids_limit: 128
    tmpfs: ['/tmp:size=64m,noexec,nosuid']
    volumes:
      - ./config/mailbox:/etc/mailboxd:ro
      - ./data/mailbox:/var/lib/mailboxd
    depends_on:
      prepare: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
  browser:
    <<: *common
    profiles: [browser]
    image: psyb0t/stealthy-auto-browse:latest
    environment:
      AUTH_TOKEN: ${BROWSER_TOKEN:-}
      PUID: ${STACK_UID:-1000}
      PGID: ${STACK_GID:-1000}
      TZ: ${TZ:-Etc/UTC}
      LANG: ${BROWSER_LANG:-en-US}
      XVFB_RESOLUTION: ${BROWSER_RESOLUTION:-1440x900x24}
      CAPTCHA_SOLVER_ENABLED: ${CAPTCHA_SOLVER_ENABLED:-false}
      CAPTCHA_SOLVER_PROVIDER: ${CAPTCHA_SOLVER_PROVIDER:-}
      CAPTCHA_SOLVER_API_KEY: ${CAPTCHA_SOLVER_API_KEY:-}
    # The upstream entrypoint fixes profile ownership before dropping privileges.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    mem_limit: ${BROWSER_MEMORY:-2g}
    cpus: ${BROWSER_CPUS:-2}
    pids_limit: 512
    shm_size: 512m
    volumes:
      - ./data/browser:/userdata
      - ./data/recordings:/recordings
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
  claude:
    <<: *common
    profiles: [agent, claude]
    extends:
      file: docker-compose.${HARNESS_PLATFORM:-claudebox}.yml
      service: harness
    environment:
      AICODEBOX_CRON_MODE: '1'
      AICODEBOX_CRON_MODE_FILE: /config/cron.yml
      AICODEBOX_TELEGRAM_MODE: '1'
      AICODEBOX_TELEGRAM_MODE_CONFIG: /config/telegram.yml
      AICODEBOX_TELEGRAM_MODE_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      AICODEBOX_WORKSPACE: /workspace
      TZ: ${TZ:-Etc/UTC}
    # CLI installation and UID matching require a writable root and bootstrap caps.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    mem_limit: ${CLAUDE_MEMORY:-4g}
    cpus: ${CLAUDE_CPUS:-2}
    pids_limit: 512
    healthcheck:
      test: [CMD, pgrep, -f, '(^|/)python3 -m aicodebox\.modes\.telegram($| )']
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 120s
    volumes:
      - ./config/generated:/config:ro
      - ./scripts/telegram_notify.py:/opt/stack/telegram_notify.py:ro
      - ./data/workspace:/workspace
    depends_on:
      prepare: {condition: service_completed_successfully}
      mailbox: {condition: service_healthy, required: false}
      browser: {condition: service_healthy, required: false}
      handoff: {condition: service_healthy, required: false}
      modembox: {condition: service_healthy, required: false}
      keepassbox: {condition: service_healthy, required: false}
  modembox:
    <<: *common
    profiles: [modembox]
    image: psyb0t/modembox:latest
    user: ${STACK_UID:-1000}:${STACK_GID:-1000}
    environment:
      MODEMBOX_TOKEN: ${MODEMBOX_TOKEN:-}
    read_only: true
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    tmpfs: ['/tmp:size=64m,noexec,nosuid']
    devices:
      - ${MODEMBOX_DEVICE:-/dev/ttyUSB0}:${MODEMBOX_DEVICE:-/dev/ttyUSB0}:rw
    group_add: ["${MODEMBOX_DEVICE_GID:-20}"]
    volumes: [./data/modembox:/data]
    healthcheck: &api_health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
  keepassbox:
    <<: *common
    profiles: [keepassbox]
    image: psyb0t/keepassbox:latest
    user: ${STACK_UID:-1000}:${STACK_GID:-1000}
    environment:
      KEEPASSBOX_ACCESS_FILE: /data/access.local.json
    read_only: true
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    tmpfs: ['/tmp:size=64m,noexec,nosuid']
    volumes: [./data/keepassbox:/data]
    depends_on:
      prepare: {condition: service_completed_successfully}
    healthcheck: *api_health
networks:
  stack:
    driver: bridge
