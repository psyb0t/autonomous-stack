name: collaborators-only
on:
  pull_request_target:
    types: [opened, reopened]
permissions: {}
jobs:
  gate:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/collaborators-only-workflow.yml@master
    with:
      close_message: No PRs. Open an issue and I'll handle it.
      lock: true
